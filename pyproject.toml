[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hud-toggle-screenshot-tool"
version = "0.4.2"
description = "Toggle HUD overlays on and off for clean screenshots on Windows."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hud-toggle contributors" }]
keywords = ["hud", "screenshot", "overlay", "windows", "toggle", "game-hud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "keyboard>=0.13.5",
    "tomli>=2.0.1; python_version < '3.11'",
    "pydantic>=2.6,<3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
hud-toggle = "hud_toggle.__main__:main"

[project.gui-scripts]
hud-toggle-gui = "hud_toggle.bootstrap.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/hud_toggle/core", "src/hud_toggle/services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=hud_toggle --cov-report=term-missing"